<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Pulse is a movie and TV discovery catalog. We index publicly available third-party links and never host, upload, or store video files."
    />
    <meta
      name="keywords"
      content="movies, TV shows, streaming directory, movie catalog, TV catalog, watch links, film discovery"
    />
    <meta name="author" content="Pulse" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <meta property="og:site_name" content="Pulse" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pulse — Movies & TV Discovery" />
    <meta
      property="og:description"
      content="Browse movies and TV shows. We provide metadata and links to third-party sources — we do not host media files."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse — Movies & TV Discovery" />
    <meta
      name="twitter:description"
      content="A link-based movie & TV catalog. We don't host or store any video files."
    />

    <link rel="canonical" href="/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <link rel="preconnect" href="https://www.apple.com/wss/fonts" crossorigin />
    <link
      rel="stylesheet"
      href="https://www.apple.com/wss/fonts?families=SF+Pro,v4|SF+Pro+Icons,v1&display=swap"
    />
    <title>Pulse — Movies & TV Discovery</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Pulse",
            "url": "/",
            "description": "Movie and TV discovery catalog that indexes third-party links. Pulse does not host or store media files.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "Organization",
            "name": "Pulse",
            "url": "/",
            "description": "A content discovery and link-indexing service. We do not own, control, or host streaming media."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
