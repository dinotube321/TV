                startSource(nextStream);
                return;
              }
              const nextEmbed = sources.find((s) => isEmbedSource(s));
              if (nextEmbed) {
                startEmbedSource(nextEmbed);
                return;
              }
              const next = VidPlay.pickSource(
                sources.filter((s) => s.backup),
                null
              );
              if (next) {
                startSource(next);
                return;
              }
            }
          }
          player.classList.remove("loading");
          showNotFoundUI(reason);
        },
      });
    }

    let skipSeekGen = 0;

    function skipBy(seconds) {
      const wasPaused = video.paused;
      const d = video.duration;
      const cur = video.currentTime || 0;
      const max = isFinite(d) && d > 0 ? d : cur + Math.abs(seconds) + 1;
      const next = Math.min(max, Math.max(0, cur + seconds));
      const gen = ++skipSeekGen;

      video.currentTime = next;
      updateProgress();
      showUI(wasPaused ? true : false);

      if (playState.hls) {
        try {
          playState.hls.startLoad(next);
        } catch (_) {}
      }

      const onSeeked = () => {
        video.removeEventListener("seeked", onSeeked);
        if (gen !== skipSeekGen) return;
        updateProgress();
        if (!wasPaused) return;

        // Force the new frame to show while staying paused (needed for HLS)
        const p = video.play();
        const settle = () => {
          if (gen !== skipSeekGen) return;
          video.pause();
          setPlayingUI(false);
          showUI(true);
        };
        if (p && typeof p.then === "function") p.then(settle).catch(settle);
        else settle();
      };
      video.addEventListener("seeked", onSeeked);
    }

    function togglePlay() {
      if (video.paused) video.play().catch(() => {});
      else video.pause();
      showUI();
    }

    function toggleMute() {
      if (video.muted || video.volume === 0) {
        video.muted = false;
        video.volume = lastVolume > 0 ? lastVolume : 1;
      } else {
        lastVolume = video.volume || 1;
        video.muted = true;
      }
      syncVolumeUI();
      toast(video.muted || video.volume === 0 ? "Muted" : "Sound on");
    }

    /* —— Controls —— */
    $("playMini").onclick = (e) => { e.stopPropagation(); togglePlay(); };
    $("bigPlayBtn").onclick = (e) => { e.stopPropagation(); togglePlay(); };
    $("btnSkipBack").onclick = (e) => { e.stopPropagation(); skipBy(-15); };
    $("btnSkipFwd").onclick = (e) => { e.stopPropagation(); skipBy(15); };

    $("btnSubs").onclick = (e) => {
      e.stopPropagation();
      renderSubsMenu();
      toggleMenu("menuSubs", "btnSubs");
    };

    $("btnSound").onclick = (e) => {
      e.stopPropagation();
      const menu = $("menuVol");
      const was = menu.classList.contains("open");
      closeMenus();
      if (!was) {
        syncVolumeUI();
        menu.classList.add("open");
        $("btnSound").classList.add("active");
        showUI(true);
      }
    };

    $("btnMute").onclick = (e) => {
      e.stopPropagation();
      toggleMute();
    };

    $("btnSpeed").onclick = (e) => {
      e.stopPropagation();
      renderSpeedMenu();
      toggleMenu("menuSpeed", "btnSpeed");
    };

    $("btnServer").onclick = (e) => {
      e.stopPropagation();
      showUI(true);
      player.classList.add("show-ui");
      renderMenus();
      toggleMenu("menuServer", "btnServer");
    };

    $("btnQuality").onclick = (e) => {
      e.stopPropagation();
      showUI(true);
      player.classList.add("show-ui");
      renderMenus();
      toggleMenu("menuQuality", "btnQuality");
    };

    $("btnPip").onclick = async (e) => {
      e.stopPropagation();
      try {
        if (document.pictureInPictureElement) await document.exitPictureInPicture();
        else await video.requestPictureInPicture();
      } catch {
        toast("PiP not available");
      }
    };

    $("btnInfo").onclick = (e) => {
      e.stopPropagation();
      const sheet = $("infoSheet");
      const open = sheet.classList.contains("open");
      closeMenus();
      if (!open) {
        sheet.classList.add("open");
        $("btnInfo").classList.add("active");
        showUI(true);
      }
    };

    function syncFullscreenIcon() {
      const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const img = $("iconFs");
      const btn = $("btnFs");
      if (img) {
        img.src = on ? "/icons/fullscreen-exit.png" : "/icons/fullscreen-enter.png";
      }
      if (btn) {
        btn.title = on ? "Exit Fullscreen" : "Fullscreen";
        btn.setAttribute("aria-label", on ? "Exit Fullscreen" : "Fullscreen");
      }
    }

    $("btnFs").onclick = (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (player.requestFullscreen || player.webkitRequestFullscreen)?.call(player);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      }
    };
    document.addEventListener("fullscreenchange", syncFullscreenIcon);
    document.addEventListener("webkitfullscreenchange", syncFullscreenIcon);

    /* Volume rail — click, drag, wheel, keys */
    const volRail = $("volRail");
    const volMenu = $("menuVol");
    const soundWrap = $("btnSound")?.closest(".icon-wrap");

    volRail.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      volDragging = true;
      volRail.classList.add("dragging");
      volRail.setPointerCapture(e.pointerId);
      setVolumeFromEvent(e);
      showUI(true);
    });
    volRail.addEventListener("pointermove", (e) => {
      if (!volDragging) return;
      e.preventDefault();
      setVolumeFromEvent(e);
    });
    const endVolDrag = (e) => {
      if (!volDragging) return;
      volDragging = false;
      volRail.classList.remove("dragging");
      try {
        if (e?.pointerId != null) volRail.releasePointerCapture(e.pointerId);
      } catch (_) {}
      showUI(true);
    };
    volRail.addEventListener("pointerup", endVolDrag);
    volRail.addEventListener("pointercancel", endVolDrag);
    volRail.addEventListener("lostpointercapture", () => {
      volDragging = false;
      volRail.classList.remove("dragging");
    });

    function onVolumeWheel(e) {
      e.preventDefault();
      e.stopPropagation();
      const step = e.deltaY > 0 || e.deltaX > 0 ? -0.05 : 0.05;
      nudgeVolume(step);
      if (!volMenu.classList.contains("open")) {
        closeMenus();
        syncVolumeUI();
        volMenu.classList.add("open");
        $("btnSound")?.classList.add("active");
      }
      showUI(true);
    }
    volMenu.addEventListener("wheel", onVolumeWheel, { passive: false });
    soundWrap?.addEventListener("wheel", onVolumeWheel, { passive: false });

    volRail.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        e.preventDefault();
        nudgeVolume(0.05);
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        e.preventDefault();
        nudgeVolume(-0.05);
      } else if (e.key === "Home") {
        e.preventDefault();
        applyVolume(1);
      } else if (e.key === "End") {
        e.preventDefault();
        applyVolume(0);
      }
    });

    /* Video / player events */
    video.addEventListener("click", () => togglePlay());
    video.addEventListener("play", () => {
      setPlayingUI(true);
      showUI();
      savePlaybackResume(true);
    });
    video.addEventListener("pause", () => {
      setPlayingUI(false);
      showUI(true);
      savePlaybackResume(true);
    });
    video.addEventListener("timeupdate", () => {
      updateProgress();
      cacheLiveFrame();
      savePlaybackResume(false);
    });
    video.addEventListener("seeked", () => savePlaybackResume(true));
    video.addEventListener("progress", updateProgress);
    video.addEventListener("loadedmetadata", () => {
      updateProgress();
      syncPreviewSize();
      startLiveCacheLoop();
    });
    video.addEventListener("waiting", () => player.classList.add("loading"));
    video.addEventListener("playing", () => {
      player.classList.remove("loading");
      syncPreviewSize();
      startLiveCacheLoop();
      if (current) reportSourcePref(current);
      // If we somehow stay in loading/shade with audio, clear chrome
      if (video.videoWidth > 0) {
        player.classList.remove("loading");
      }
    });
    // Decoded frames arrived — ensure overlays aren't stuck
    video.addEventListener("loadeddata", () => {
      if (video.videoWidth > 0) player.classList.remove("loading");
    });
    video.addEventListener("resize", syncPreviewSize);
    video.addEventListener("volumechange", syncVolumeUI);

    player.addEventListener("mousemove", () => showUI());
    player.addEventListener("touchstart", () => showUI(), { passive: true });
    $("embedReveal")?.addEventListener("mouseenter", () => showUI());
    $("embedReveal")?.addEventListener("mousemove", () => showUI());
    $("embedReveal")?.addEventListener(
      "touchstart",
      () => showUI(),
      { passive: true },
    );

    const bar = $("barWrap");
    bar.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      dragging = true;
      hoveringProgress = true;
      bar.setPointerCapture(e.pointerId);
      seekFromEvent(e);
      showSeekPreview(e);
      showUI(true);
    });
    bar.addEventListener("pointermove", (e) => {
      if (dragging) seekFromEvent(e);
      showSeekPreview(e);
    });
    bar.addEventListener("pointerenter", (e) => {
      hoveringProgress = true;
      showUI(true);
      showSeekPreview(e);
    });
    bar.addEventListener("pointerleave", () => {
      if (!dragging) hideSeekPreview();
    });
    bar.addEventListener("pointerup", () => {
      dragging = false;
      hideSeekPreview();
    });
    bar.addEventListener("pointercancel", () => {
      dragging = false;
      hideSeekPreview();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === " " || e.key === "k" || e.key === "K") {
        e.preventDefault();
        togglePlay();
      }
      if (e.key === "f" || e.key === "F") $("btnFs").click();
      if (e.key === "m" || e.key === "M") toggleMute();
      if (e.key === "ArrowRight") {
        e.preventDefault();
        skipBy(15);
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        skipBy(-15);
      }
      if (e.key === "Escape") closeMenus();
    });

    document.addEventListener("click", (e) => {
      if (
        !e.target.closest(".icon-wrap") &&
        !e.target.closest(".info-sheet") &&
        !e.target.closest(".vol-menu")
      ) {
        closeMenus();
      }
    });

    async function fetchFullServers(route) {
      try {
        const url = route.api + (route.api.includes("?") ? "&" : "?") + "full=1&backup=1";
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) return;
        rememberBackupProviders(data.backupProviders);
        rememberServerNames(data.servers);
        const changed = mergeSources(data.sources || []);
        if (data.subtitles?.length) {
          const seen = new Set(subtitles.map((s) => s.url));
          data.subtitles.forEach((s) => {
            if (s.url && !seen.has(s.url)) {
              seen.add(s.url);
              subtitles.push(s);
            }
          });
        }
        if (changed || (data.backupProviders && data.backupProviders.length) || (data.servers && data.servers.length)) {
          renderMenus();
          renderSubsMenu();
          if (current && !isEmbedSource(current)) setupPreview(current);
          // If we started on Classic/proxy, upgrade to admin-preferred fast server once backups arrive
          if (
            current &&
            !isEmbedSource(current) &&
            (current.server === "Classic" ||
              /\/proxy\?/i.test(String(current.playUrl || "")))
          ) {
            const better = VidPlay.pickSource(sources, data.preferred || null);
            if (
              better &&
              better.playUrl &&
              better.playUrl !== current.playUrl &&
              better.server !== "Classic" &&
              !/\/proxy\?/i.test(String(better.playUrl || ""))
            ) {
              const t = Number(video.currentTime) || 0;
              pendingResume = {
                t,
                paused: !!video.paused,
                playUrl: better.playUrl,
              };
              startSource(better);
            }
          }
        }
      } catch {
        /* background enrich — ignore */
      }
    }

    async function loadBackupProviderList() {
      try {
        const res = await fetch("/api/backup/providers");
        const data = await res.json();
        if (data.ok) rememberBackupProviders(data.providers);
      } catch {
        /* ignore */
      }
    }

    (async () => {
      const route = parseRoute();
      if (!route) {
        $("eyebrow").textContent = "Invalid URL";
        $("title").textContent = "Use /embed/movies/{id}";
        player.classList.remove("loading");
        return;
      }
      activeRoute = route;
      pendingResume = readPlaybackResume(route);

      function readWarmExtract(apiPath) {
        try {
          // localStorage: shared with parent page (sessionStorage is per-iframe)
          const raw = localStorage.getItem(`pulse.extract.v4:${apiPath}`);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed?.savedAt || Date.now() - parsed.savedAt > 12 * 60_000) {
            localStorage.removeItem(`pulse.extract.v4:${apiPath}`);
            return null;
          }
          const data = parsed.data && parsed.data.ok ? parsed.data : null;
          if (!data) return null;
          // Stale caches that only lock onto Classic/proxy — refetch for admin order
          const prefUrl = String(data.preferred?.playUrl || "");
          const onRender = /\.onrender\.com$/i.test(location.hostname);
          if (
            onRender &&
            (data.preferred?.server === "Classic" || /\/proxy\?/i.test(prefUrl))
          ) {
            localStorage.removeItem(`pulse.extract.v4:${apiPath}`);
            return null;
          }
          return data;
        } catch {
          return null;
        }
      }

      function writeWarmExtract(apiPath, data) {
        try {
          localStorage.setItem(
            `pulse.extract.v4:${apiPath}`,
            JSON.stringify({ savedAt: Date.now(), data }),
          );
        } catch {
          /* ignore */
        }
      }

      // Kick extract immediately (don't wait on ads / adblock)
      const warmCached = readWarmExtract(route.api);
      const extractPromise = warmCached
        ? Promise.resolve(warmCached)
        : fetch(route.api)
            .then((res) => res.json())
            .then((data) => {
              if (data?.ok) writeWarmExtract(route.api, data);
              return data;
            });

      // Admin can disable ads site-wide or per signed-in user
      try {
        const headers = {};
        try {
          const token = localStorage.getItem("pulse.auth.token");
          if (token) headers.Authorization = `Bearer ${token}`;
        } catch {
          /* private mode */
        }
        const settingsRes = await fetch("/api/settings", { headers });
        if (settingsRes.ok) {
          const settings = await settingsRes.json();
          if (window.AdsConfig) {
            window.AdsConfig.enabled = settings.adsEnabled !== false;
          }
          if (
            window.VidPlay &&
            typeof window.VidPlay.setServerOrder === "function" &&
            Array.isArray(settings.streamServerOrder)
          ) {
            window.VidPlay.setServerOrder(settings.streamServerOrder);
          }
        }
      } catch {
        /* keep AdsConfig default */
      }

      const adsOn = !window.AdsConfig || window.AdsConfig.enabled !== false;

      // Adblock gate — must clear before playback (only when ads are on)
      // Runs in parallel with extractPromise above
      if (adsOn && window.AdblockGuard) {
        await AdblockGuard.gate(player);
      }

      if (adsOn) {
        window.adManager = new AdManager({
          player,
          contentVideo: video,
          root: player,
        });
      }

      loadBackupProviderList();

      try {
        const data = await extractPromise;
        if (!data.ok) throw new Error(data.error || "Extract failed");
        sources = data.sources || [];
        subtitles = data.subtitles || [];
        rememberBackupProviders(data.backupProviders);
        rememberServerNames(data.servers);
        setMeta(data);
        let chosen = VidPlay.pickSource(sources, data.preferred);
        // Resume time only — do NOT force a remembered Classic/proxy URL over admin order
        if (pendingResume?.playUrl) {
          const same = sources.find(
            (s) => s.playUrl === pendingResume.playUrl && !isEmbedSource(s),
          );
          if (same && chosen) {
            const resumeSlow =
              same.server === "Classic" ||
              /\/proxy\?/i.test(String(same.playUrl || ""));
            const chosenFast =
              /^https?:\/\//i.test(String(chosen.playUrl || "")) &&
              !/\/proxy\?/i.test(String(chosen.playUrl || ""));
            const resumeScore = VidPlay.playabilityScore
              ? VidPlay.playabilityScore(same)
              : 0;
            const bestScore = VidPlay.playabilityScore
              ? VidPlay.playabilityScore(chosen)
              : 1;
            if (
              same.playUrl === chosen.playUrl ||
              (!(resumeSlow && chosenFast) && resumeScore >= bestScore - 40)
            ) {
              chosen = same;
            }
            // else keep admin/fast pick; pendingResume.t still restores position
          } else if (same && !chosen) {
            chosen = same;
          }
        }
        if (!chosen) {
          await ensureBackupSources({ force: true });
          chosen = VidPlay.pickSource(sources, null);
        }
        if (!chosen) throw new Error("No playable source");
        renderMenus();
        renderSpeedMenu();
        renderSubsMenu();
        syncVolumeUI();

        startSource(chosen);
        showUI(true);
        fetchFullServers(route);
      } catch (err) {
        // Last resort: backup-only extract
        try {
          await ensureBackupSources({ force: true });
          const chosen = VidPlay.pickSource(sources, null);
          if (chosen) {
            renderMenus();
            renderSpeedMenu();
            renderSubsMenu();
            syncVolumeUI();
            startSource(chosen);
            showUI(true);
            return;
          }
        } catch (_) {}
        player.classList.remove("loading");
        showNotFoundUI(err.message);
      }
    })();

    window.addEventListener("pagehide", () => {
      savePlaybackResume(true);
      if (typeof VidPlay !== "undefined" && VidPlay.destroyHls) {
        VidPlay.destroyHls(playState);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") savePlaybackResume(true);
    });
  </script>
</body>
</html>
