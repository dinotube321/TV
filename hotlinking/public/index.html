<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed Engine</title>
  <style>
    :root {
      --bg: #000;
      --panel: rgba(28, 28, 30, 0.72);
      --text: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.55);
      --line: rgba(255,255,255,.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(90,90,120,.35), transparent 60%),
        #000;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }
    h1 {
      margin: 0 0 .4rem;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 36rem; }
    .panel {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(30px);
      border: 1px solid var(--line);
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
    }
    input, select {
      flex: 1 1 160px;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      padding: .85rem 1rem;
      font: inherit;
      background: rgba(255,255,255,.08);
      color: #fff;
      outline: none;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: .85rem 1.2rem;
      font: inherit;
      font-weight: 600;
      background: #fff;
      color: #111;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }
    .frame {
      margin-top: 1rem;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #000;
      box-shadow: 0 30px 80px rgba(0,0,0,.55);
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .links {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .links a {
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: .45rem .8rem;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--line);
    }
    code { color: rgba(255,255,255,.75); font-size: 0.86em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Apple-style player</h1>
    <p>
      Clean TVOS-inspired controls with glass Server / Quality menus.
      Routes: <code>/embed/movies/{id}</code> · <code>/embed/shows/{id}/{s}/{e}</code>
    </p>

    <form class="panel" id="form">
      <select id="kind">
        <option value="movie">Movie</option>
        <option value="show">Show</option>
      </select>
      <input id="id" type="text" inputmode="numeric" placeholder="TMDB id" value="1078605" required />
      <input id="season" type="text" inputmode="numeric" placeholder="Season" value="1" style="display:none;flex:0 1 90px" />
      <input id="episode" type="text" inputmode="numeric" placeholder="Episode" value="6" style="display:none;flex:0 1 90px" />
      <button type="submit">Open</button>
    </form>

    <div class="links">
      <a href="/embed/movies/1078605" target="player">Weapons</a>
      <a href="/embed/shows/1396/1/6" target="player">Breaking Bad S1E6</a>
      <a href="/embed/shows/1396/1/1" target="player">Breaking Bad S1E1</a>
    </div>

    <div class="frame">
      <iframe name="player" id="frame" src="/embed/movies/1078605" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>
  </div>

  <script>
    const kind = document.getElementById("kind");
    const season = document.getElementById("season");
    const episode = document.getElementById("episode");
    kind.addEventListener("change", () => {
      const show = kind.value === "show";
      season.style.display = show ? "" : "none";
      episode.style.display = show ? "" : "none";
      if (show) document.getElementById("id").value = "1396";
      else document.getElementById("id").value = "1078605";
    });
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const id = document.getElementById("id").value.trim();
      let url =
        kind.value === "movie"
          ? `/embed/movies/${id}`
          : `/embed/shows/${id}/${season.value || 1}/${episode.value || 1}`;
      document.getElementById("frame").src = url;
    });
  </script>
</body>
</html>
